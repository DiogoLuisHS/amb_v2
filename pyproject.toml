[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amb-cli"
version = "2.3.0"
description = "CLI Global do AMB_V2 - Automação, Agentes de Manutenção e Integrações de Engenharia"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.scripts]
amb = "amb_cli.cli:main"

[tool.setuptools]
py-modules = ["cli", "amb_bootstrap"]

[tool.setuptools.packages.find]
where = ["."]
include = ["amb_cli*"]
exclude = ["tests*", "scratch*", "docs*"]

[tool.pytest.ini_options]
pythonpath = [".", "amb_cli"]
testpaths = ["tests"]
