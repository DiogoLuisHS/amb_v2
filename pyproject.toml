[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amb-cli"
version = "2.0.0"
description = "CLI Global do AMB_V2 - Automação, Agentes de Manutenção e Integrações de Engenharia"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.scripts]
amb = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "scratch*"]
